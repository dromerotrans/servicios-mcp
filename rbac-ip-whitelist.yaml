apiVersion: v1
kind: ServiceAccount
metadata:
  name: servicios-mcp
  namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: servicios-mcp-route-editor
  namespace: hermes
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    resourceNames: ["servicios-mcp"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: servicios-mcp-route-editor
  namespace: hermes
subjects:
  - kind: ServiceAccount
    name: servicios-mcp
    namespace: hermes
roleRef:
  kind: Role
  name: servicios-mcp-route-editor
  apiGroup: rbac.authorization.k8s.io
